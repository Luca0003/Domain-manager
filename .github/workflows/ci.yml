name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://domain_manager:domain_manager_local@localhost:5432/domain_manager

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build