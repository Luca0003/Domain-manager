name: domain-manager

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-domain_manager}
      POSTGRES_USER: ${POSTGRES_USER:-domain_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-domain_manager_local}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-domain_manager} -d ${POSTGRES_DB:-domain_manager}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  postfix:
    build:
      context: .
      dockerfile: docker/postfix/Dockerfile
    restart: unless-stopped
    environment:
      POSTFIX_HOSTNAME: ${POSTFIX_HOSTNAME:-mail.domainmanager.local}
      POSTFIX_DOMAIN: ${POSTFIX_DOMAIN:-domainmanager.local}
      POSTFIX_MESSAGE_SIZE_LIMIT: ${POSTFIX_MESSAGE_SIZE_LIMIT:-10485760}
    expose:
      - "25"
    healthcheck:
      test: ["CMD-SHELL", "postfix status >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-domain_manager}:${POSTGRES_PASSWORD:-domain_manager_local}@postgres:5432/${POSTGRES_DB:-domain_manager}?schema=public
    command:
      [
        "pnpm",
        "--filter",
        "@domain-manager/database",
        "exec",
        "prisma",
        "migrate",
        "deploy",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3001
      WEB_URL: http://192.168.1.50:${WEB_PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-domain_manager}:${POSTGRES_PASSWORD:-domain_manager_local}@postgres:5432/${POSTGRES_DB:-domain_manager}?schema=public
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-domain-manager-local-internal-key}
      POSTFIX_SMTP_HOST: postfix
      POSTFIX_SMTP_PORT: 25
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Domain Manager}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_CONFIG_PATH: /var/lib/domain-manager/email-provider.json
      AUTH_STATE_PATH: /var/lib/domain-manager/demo-auth.json
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@domainmanager.local}
      DEMO_ADMIN_INITIAL_PASSWORD: ${DEMO_ADMIN_INITIAL_PASSWORD:-Admin123!}
      DEMO_ADMIN_RECOVERY_EMAIL: ${DEMO_ADMIN_RECOVERY_EMAIL:-}
      WEB_PUBLIC_URL: http://192.168.1.50:${WEB_PORT:-3000}
    volumes:
      - email_config_data:/var/lib/domain-manager
    command: ["pnpm", "--filter", "@domain-manager/api", "start"]
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postfix:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:3001/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-domain_manager}:${POSTGRES_PASSWORD:-domain_manager_local}@postgres:5432/${POSTGRES_DB:-domain_manager}?schema=public
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    command: ["pnpm", "--filter", "@domain-manager/worker", "start"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://192.168.1.50:${API_PORT:-3001}
      API_INTERNAL_URL: http://api:3001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-domain-manager-local-internal-key}
    command: ["pnpm", "--filter", "@domain-manager/web", "start"]
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:3000/login >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  email_config_data:
